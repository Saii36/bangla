[package]
name = "bangla-typing-master"
version = "1.0.0"
description = "Offline Bangla Typing Master native Linux desktop application"
authors = ["Bangla Typing Master Contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "bangla_typing_master_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "bangla-typing-master"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
